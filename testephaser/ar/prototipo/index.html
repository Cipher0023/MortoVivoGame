<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Morto Vivo AR (protótipo)</title>
<style>
  :root {
    --amarelo: #f6c63b;
    --tinta: #3b2320;
    --fundo: #1a1a2e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #ar { position: fixed; inset: 0; }

  .tela {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 2rem 1.5rem;
    text-align: center;
    background: var(--fundo);
  }
  .tela h1 { margin: 0; font-size: 1.6rem; color: var(--amarelo); }
  .tela p { margin: 0; max-width: 22rem; color: #ddd; }
  .tela .erro { color: #ffb4a8; }

  button, .botao {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 0.9rem 1.8rem;
    font: inherit;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--tinta);
    background: var(--amarelo);
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 4px 0 #b88a12;
  }
  button:active, .botao:active { transform: translateY(2px); box-shadow: 0 2px 0 #b88a12; }
  .link { color: var(--amarelo); }

  #status {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 1rem);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.6);
    font-size: 0.95rem;
    white-space: nowrap;
  }
  #jogar {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
  }
  #jogar:active { transform: translate(-50%, 2px); }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="ar"></div>

<section class="tela" id="inicio">
  <h1>Morto Vivo AR</h1>
  <p>Abra o livro na página do Guri e aponte a câmera para ela.</p>
  <button type="button" id="abrir">Abrir câmera</button>
</section>

<section class="tela" id="falha" hidden>
  <h1>Não deu para abrir a câmera</h1>
  <p class="erro" id="falha-msg"></p>
  <a class="botao" href="https://mortovivo.cristiancobra.com.br/">Abrir o jogo</a>
  <p>No jogo, toque em <strong>Jogar</strong> e depois em <strong>Digitar código</strong>.</p>
</section>

<div id="status" hidden>Procurando a página…</div>
<button type="button" id="jogar" hidden></button>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import { PHASES } from './phases.js';

const GAME_URL = 'https://mortovivo.cristiancobra.com.br/';
// ?debug=1 desenha a borda da página reconhecida (pra ver se o encaixe treme)
const DEBUG = new URLSearchParams(location.search).has('debug');

// Guri: os quadros de caminhada do jogo (public/assets/boy)
const WALK_FRAMES = 12;
const WALK_FPS = 14;
// medidas em "larguras de página" (o MindAR põe a página com largura 1,
// centro na origem, x pra direita, y pra cima, z saindo do papel)
const GURI_HEIGHT = 0.36;
const GURI_ASPECT = 202 / 291;
const WALK_SPEED = 0.16;
const WALK_LIMIT = 0.32;
const WALK_Y = -0.28;
const POP_MS = 450;
const MAX_TILT = THREE.MathUtils.degToRad(80);

const $ = (id) => document.getElementById(id);
const status = $('status');
const playButton = $('jogar');

const targets = await fetch('./alvos.json').then((r) => r.json());

let mindar = null;

$('abrir').addEventListener('click', start, { once: true });

async function start() {
  $('abrir').textContent = 'Abrindo…';
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    fail('A câmera só funciona com o site em HTTPS.');
    return;
  }

  mindar = new MindARThree({
    container: $('ar'),
    imageTargetSrc: './targets.mind',
    maxTrack: 1,
    uiLoading: 'no',
    uiScanning: 'no',
    uiError: 'no',
    // filtro mais forte: menos tremor, um pouco mais de atraso
    filterMinCF: 0.0001,
    filterBeta: 0.001,
  });
  const { renderer, scene, camera } = mindar;

  const frames = await loadWalkFrames();
  const characters = targets.map((target, index) => buildTarget(target, index, frames));

  try {
    await mindar.start();
  } catch (error) {
    console.error(error);
    const denied = error?.name === 'NotAllowedError' || error?.name === 'SecurityError';
    fail(denied
      ? 'Sem permissão para usar a câmera. Libere o acesso nas configurações do navegador.'
      : 'Não encontramos uma câmera neste aparelho.');
    return;
  }

  $('inicio').hidden = true;
  status.hidden = false;

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.1);
    for (const character of characters) character.update(dt);
    renderer.render(scene, camera);
  });
}

function buildTarget(target, index, frames) {
  const phase = PHASES.find((p) => p.number === target.phase);
  const anchor = mindar.addAnchor(index);
  const stage = new THREE.Group();
  anchor.group.add(stage);

  // sombra no papel
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.5, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false }),
  );
  shadow.scale.set(GURI_HEIGHT * GURI_ASPECT * 0.9, GURI_HEIGHT * 0.12, 1);
  shadow.position.z = 0.002;
  stage.add(shadow);

  // Guri apoiado nos pés, girando em torno deles pra ficar de frente pra
  // câmera (ver update): com o celular inclinado ele fica em pé; com o
  // celular de frente pra página, deita sobre ela em vez de virar um risco
  const material = new THREE.MeshBasicMaterial({
    map: frames[0], transparent: true, alphaTest: 0.1, side: THREE.DoubleSide,
  });
  const geometry = new THREE.PlaneGeometry(GURI_HEIGHT * GURI_ASPECT, GURI_HEIGHT);
  geometry.translate(0, GURI_HEIGHT / 2, 0);
  const guri = new THREE.Mesh(geometry, material);
  guri.position.z = 0.003;
  stage.add(guri);
  const cameraLocal = new THREE.Vector3();

  if (DEBUG) {
    const half = 0.5;
    const top = 0.5 * (target.height ?? 1);
    const border = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-half, -top, 0), new THREE.Vector3(half, -top, 0),
        new THREE.Vector3(half, top, 0), new THREE.Vector3(-half, top, 0),
      ]),
      new THREE.LineBasicMaterial({ color: 0xe0006a }),
    );
    anchor.group.add(border);
  }

  let x = -WALK_LIMIT;
  let dir = 1;
  let frameTime = 0;
  let poppedAt = null;

  anchor.onTargetFound = () => {
    poppedAt = performance.now();
    status.textContent = 'Achei a página!';
    if (phase) {
      playButton.textContent = `Jogar a ${phase.title}`;
      playButton.onclick = () => openGame(phase);
      playButton.hidden = false;
    }
  };
  anchor.onTargetLost = () => {
    status.textContent = 'Procurando a página…';
  };

  return {
    update(dt) {
      if (!anchor.visible) return;
      x += dir * WALK_SPEED * dt;
      if (Math.abs(x) > WALK_LIMIT) {
        x = Math.sign(x) * WALK_LIMIT;
        dir = -dir;
      }
      frameTime += dt;
      material.map = frames[Math.floor(frameTime * WALK_FPS) % WALK_FRAMES];
      // os quadros olham pra direita; andando pra esquerda, espelha
      guri.scale.x = dir;
      stage.position.set(x, WALK_Y, 0);

      // inclinação: 0 = deitado na página, 90° = em pé. Segue a direção da
      // câmera vista de lado (plano y-z da página), suavizada contra tremor
      cameraLocal.copy(mindar.camera.position);
      anchor.group.worldToLocal(cameraLocal);
      const tilt = Math.atan2(-(cameraLocal.y - WALK_Y), cameraLocal.z);
      const target = THREE.MathUtils.clamp(tilt, 0, MAX_TILT);
      guri.rotation.x += (target - guri.rotation.x) * Math.min(1, dt * 8);

      // ao achar a página, o Guri "salta" do papel
      const t = Math.min(1, (performance.now() - poppedAt) / POP_MS);
      const pop = t < 1 ? easeOutBack(t) : 1;
      stage.scale.setScalar(Math.max(0.001, pop));
    },
  };
}

function loadWalkFrames() {
  const loader = new THREE.TextureLoader();
  return Promise.all(Array.from({ length: WALK_FRAMES }, (_, i) => {
    const n = String(i + 1).padStart(2, '0');
    return loader.loadAsync(`./guri/walk_${n}.png`).then((texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    });
  }));
}

function easeOutBack(t) {
  const c = 1.70158;
  return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
}

async function openGame(phase) {
  playButton.disabled = true;
  playButton.textContent = 'Abrindo o jogo…';
  // solta a câmera antes de sair (no celular, o jogo vai precisar da memória)
  mindar.renderer.setAnimationLoop(null);
  mindar.stop();
  location.href = `${GAME_URL}?fase=${encodeURIComponent(phase.code)}`;
}

function fail(message) {
  $('falha-msg').textContent = message;
  $('inicio').hidden = true;
  $('falha').hidden = false;
}
</script>
</body>
</html>
