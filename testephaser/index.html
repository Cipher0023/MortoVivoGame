<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Morto Vivo game</title>
    <!-- "Adicionar à tela de início": abre sem barra do navegador. É o único
         jeito de tela cheia no iPhone, onde o Safari não tem a API de fullscreen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Morto Vivo" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a1a2e;
        height: 100%;
        overflow: hidden;
        /* touch: sem zoom por duplo toque, sem seleção de texto nem menu de "segurar" */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Ocupa só a área VISÍVEL da tela. Não usar 100vh: no celular ele mede
         a tela sem a barra de endereços, então com a barra aparecendo o
         contêiner fica mais alto que o visível e o Phaser encaixa o jogo
         nesse espaço maior — cortando a parte de baixo. Os env() afastam o
         jogo do entalhe da câmera (notch) em celulares que têm. */
      #game-container {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Aviso de girar o aparelho: tela na vertical, a partir do JOGAR (o
         menu funciona em pé — ver src/ui/orientation.js, que também pausa o
         jogo enquanto o aviso aparece). O jogo é 16:9 e fica minúsculo em pé. */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1a1a2e;
        color: #ffffff;
        font-family: monospace;
        font-size: 20px;
        line-height: 1.5;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
      }
      #rotate-hint .phone {
        width: 56px;
        height: 96px;
        border: 5px solid #ffffff;
        border-radius: 12px;
        animation: rotate-phone 2s ease-in-out infinite;
      }
      @keyframes rotate-phone {
        0%, 20% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(90deg); }
      }
      @media (orientation: portrait) {
        body.landscape-required #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint">
      <div class="phone"></div>
      <div>Gire o aparelho para a horizontal<br />para jogar</div>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
